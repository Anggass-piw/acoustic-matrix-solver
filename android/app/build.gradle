plugins {
    id 'com.android.application'
}

android {
    namespace 'id.cue.acousticmatrixsolver'
    compileSdk 35

    defaultConfig {
        applicationId 'id.cue.acousticmatrixsolver'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
